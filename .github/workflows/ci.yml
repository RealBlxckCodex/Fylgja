name: CI
on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FYLGJA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./evals ./web ./migrations)"
      - name: vet
        run: go vet ./...
      - name: Unit-, Integrations-, Policy- und Injection-Tests
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - name: Typecheck & Build
        run: npm run build
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web

  images:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Control Plane
        uses: docker/build-push-action@v6
        with: { context: ., file: Dockerfile, push: false }
      - name: Computer
        uses: docker/build-push-action@v6
        with: { context: ., file: deploy/computer/Dockerfile, push: false }
